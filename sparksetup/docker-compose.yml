version: '3.8'

networks:
  spark-network:
    driver: bridge

services:
  spark-master:
    image: apache/spark:3.5.0
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./apps:/opt/spark/apps
    networks:
      - spark-network

  spark-worker-1:
    image: apache/spark:3.5.0
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./apps:/opt/spark/apps
    networks:
      - spark-network

  spark-worker-2:
    image: apache/spark:3.5.0
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    volumes:
      - ./apps:/opt/spark/apps
    networks:
      - spark-network

  pyspark:
      image: jupyter/pyspark-notebook:spark-3.5.0
      container_name: pyspark
      depends_on:
        - spark-master
      ports:
        - "8888:8888"
        - "4040:4040"
      environment:
        - SPARK_MASTER=spark://spark-master:7077
      volumes:
      - ./apps:/home/jovyan/work
      networks:
      - spark-network